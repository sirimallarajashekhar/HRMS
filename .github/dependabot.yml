version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Microsoft.* 11.x targets net11; stay on 10.x until we move the SDK on purpose.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 8+ requires a paid license for commercial use; stay on 7.x.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/src/Host/Hrms.Api", "/src/Host/Hrms.Worker"]
    schedule: { interval: weekly }
    ignore:
      # The solution targets net10.0 and global.json pins SDK 10; moving to .NET 11 is a deliberate migration.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The product is specified and tested on MySQL 8.4 LTS; never auto-bump the database engine.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
