name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the comment is the human-readable version).
# Dependabot (github-actions ecosystem) keeps them current.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config -q
      - name: Restore
        run: dotnet restore Hrms.sln
      - name: Build (warnings are errors, including NuGet vulnerability audit)
        run: dotnet build Hrms.sln -c Release --no-restore -warnaserror
      - name: Unit and architecture tests
        run: >
          dotnet test Hrms.sln -c Release --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests (Testcontainers MySQL)
        run: >
          dotnet test tests/Hrms.Core.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

  vulnerabilities:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Fail on vulnerable packages (including transitive)
        run: |
          dotnet restore Hrms.sln
          dotnet list Hrms.sln package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          # `dotnet list package` always exits 0, so look for its report line. The build also fails on NuGet audit warnings.
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages found (see log)."
            exit 1
          fi

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal repositories. Moving the repo to an organisation needs a GITLEAKS_LICENSE secret.

  docker:
    name: docker-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image:
          - { name: hrms-api, dockerfile: src/Host/Hrms.Api/Dockerfile }
          - { name: hrms-worker, dockerfile: src/Host/Hrms.Worker/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image.name }} (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
