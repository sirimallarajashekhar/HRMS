# Local infrastructure for the HRMS. `docker compose up -d` starts the dependencies;
# `docker compose --profile app up -d --build` also runs the API and worker in containers.
name: hrms

services:
  mysql:
    image: mysql:26.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrms}
      MYSQL_USER: ${MYSQL_USER:-hrms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=256M
      - --max-connections=200
      - --transaction-isolation=READ-COMMITTED
      - --binlog-expire-logs-seconds=86400
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?copy .env.example to .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hrms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  objectstore:
    # S3-compatible store for local development (MinIO stopped publishing public images). Production uses real S3 behind IFileStorage.
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-hrmsstore}
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${OBJECTSTORE_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${OBJECTSTORE_CONSOLE_PORT:-9001}:9001" # console
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local development only
    ports:
      - "127.0.0.1:${SEQ_INGEST_PORT:-5341}:5341" # ingestion
      - "127.0.0.1:${SEQ_UI_PORT:-8081}:80"   # UI
    volumes:
      - seq-data:/data

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Host/Hrms.Api/Dockerfile
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mysql: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-hrms};User ID=${MYSQL_USER:-hrms};Password=${MYSQL_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER:-hrms}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Seq__ServerUrl: http://seq:5341
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Host/Hrms.Worker/Dockerfile
    environment: *app-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  objectstore-data:
  seq-data:
